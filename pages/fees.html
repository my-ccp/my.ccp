<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MY CCP – حاسبة الرسوم</title>
  <meta name="theme-color" content="#1b4fa8"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="icon" type="image/png" href="../icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    /* ===== FEES PAGE SPECIFIC ===== */
    #fees-app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
      direction: rtl;
      transition: background var(--transition, 0.3s);
    }

    /* Header */
    .fees-header {
      background: var(--header-bg, linear-gradient(135deg, #1b4fa8, #2563eb));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      min-height: 56px;
    }
    .fees-header-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      flex: 1;
      text-align: center;
    }
    .fees-back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
    }
    .fees-back-btn:hover { background: rgba(255,255,255,0.25); }

    /* OP Banner */
    .fees-op-banner {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 16px 10px;
    }
    .fees-op-title { text-align: right; }
    .fees-op-title .op-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      direction: rtl;
    }
    .fees-op-title .op-sub {
      font-size: 0.8rem;
      color: var(--text2);
      direction: rtl;
    }
    .fees-op-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fees-op-icon svg { color: #fff; }

    /* Fields */
    .fees-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 16px 16px;
      flex: 1;
      overflow-y: auto;
    }
    .fees-field {
      background: var(--input-bg, #ffffff);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      position: relative;
      transition: background var(--transition, 0.3s);
    }
    .fees-field input {
      width: 100%;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      font-family: inherit;
      background: transparent;
      border: none;
      outline: none;
    }
    .fees-field input::placeholder {
      color: #aab4c8;
      font-weight: 500;
    }
    .fees-field .field-label {
      position: absolute;
      inset-inline-end: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #aab4c8;
      pointer-events: none;
      display: none;
    }
    .fees-field.has-value .field-label { display: block; }
    .fees-field .field-value {
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      width: 100%;
      direction: ltr;
    }
    .fees-field .field-placeholder {
      font-size: 0.95rem;
      color: #aab4c8;
      font-weight: 500;
    }
    .fees-field.amount-field input { font-size: 1.2rem; }

    /* Copy icon */
    .fees-field .copy-icon {
      position: absolute;
      inset-inline-start: 12px;
      cursor: pointer;
      color: #aab4c8;
      display: none;
    }
    .fees-field.has-value .copy-icon { display: flex; }
    .fees-field .copy-icon:hover { color: var(--accent); }

    /* ===== CASH BREAKDOWN with coin/note images ===== */
    .cash-breakdown-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .cash-breakdown-items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .cash-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 60px;
    }
    .cash-item-img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .cash-item-img.note-img {
      width: 80px;
      height: 50px;
      border-radius: 6px;
    }
    .cash-item-count {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(var(--accent-rgb, 27,79,168),0.1);
      border-radius: 20px;
      padding: 2px 8px;
    }
    .cash-item-label {
      font-size: 0.7rem;
      color: #888;
      font-weight: 600;
    }

    /* Bottom nav */
    .fees-bottom-nav {
      background: var(--nav-bg, #f5f5f5);
      display: flex;
      border-top: 1px solid var(--border, #e0e0e0);
      position: sticky;
      bottom: 0;
      transition: background var(--transition, 0.3s);
    }
    .fees-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px 12px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      border-radius: 0;
      transition: color 0.2s;
    }
    .fees-nav-item.active {
      background: rgba(37,99,235,0.08);
      color: var(--accent);
      border-radius: 12px 12px 0 0;
    }
    .fees-nav-item .nav-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .fees-nav-item.active .nav-icon-wrap { background: var(--accent); }

    /* Other fees info card */
    .fees-other-card {
      background: var(--input-bg, #fff);
      border-radius: 14px;
      padding: 16px;
      margin: 0 16px 12px;
      transition: background var(--transition, 0.3s);
    }
    .fees-other-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      text-align: right;
    }
    .fees-other-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border, #f0f0f0);
      font-size: 0.85rem;
    }
    .fees-other-item:last-child { border-bottom: none; }
    .fees-other-item .item-label { color: var(--text2); }
    .fees-other-item .item-amount { font-weight: 800; color: var(--accent); }

    /* back button: RTL → right side (exit right), LTR → left side (exit left) */
    body[data-lang="fr"] .fees-header,
    body[data-lang="en"] .fees-header {
      flex-direction: row-reverse;
    }
    body[data-lang="fr"] .fees-back-btn svg,
    body[data-lang="en"] .fees-back-btn svg {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
<div id="app-wrapper">
<div id="fees-app">

  <!-- Header -->
  <header class="fees-header">
    <button class="fees-back-btn" onclick="history.back()">
      <!-- Arrow always points toward exit: right in RTL, left in LTR -->
      <svg id="backArrowSvg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
    <div class="fees-header-title" data-i18n="fees_page_title">حاسبة الرسوم</div>
    <div style="width:38px;"></div>
  </header>

  <!-- Main scroll area -->
  <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;">

    <!-- OP Banner -->
    <div class="fees-op-banner" id="opBanner">
      <div class="fees-op-title">
        <div class="op-name" id="opName">رسوم الدفع نقدا</div>
        <div class="op-sub" id="opSub">مكتب البريد</div>
      </div>
      <div class="fees-op-icon" id="opIcon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="14" rx="2"/>
          <path d="M2 10h20"/><circle cx="12" cy="15" r="2"/>
        </svg>
      </div>
    </div>

    <!-- Fields -->
    <div class="fees-fields" id="feesFields">
      <!-- Amount -->
      <div class="fees-field amount-field">
        <input type="number" id="amountInput" data-i18n-ph="enter_amount_ph" placeholder="أدخل المبلغ بالدينار الجزائري" inputmode="decimal" oninput="calcFees()"/>
      </div>
      <!-- Fee -->
      <div class="fees-field" id="feeField">
        <span class="field-placeholder" id="feePlaceholder" data-i18n="fees_field_fee">الرسم</span>
        <span class="field-value" id="feeValue" style="display:none;"></span>
        <span class="copy-icon" onclick="copyField('feeValue')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </div>
      <!-- Total -->
      <div class="fees-field" id="totalField">
        <span class="field-placeholder" id="totalPlaceholder" data-i18n="fees_field_total">المجموع</span>
        <span class="field-value" id="totalValue" style="display:none;"></span>
        <span class="copy-icon" onclick="copyField('totalValue')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </div>
      <!-- In words -->
      <div class="fees-field" id="wordsField">
        <span class="field-placeholder" id="wordsPlaceholder" data-i18n="fees_field_words">بالأحرف</span>
        <span class="field-value" id="wordsValue" style="display:none;font-size:0.85rem;"></span>
        <span class="copy-icon" onclick="copyField('wordsValue')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </div>
      <!-- Cash/Naqdan with coin images -->
      <div class="fees-field" id="cashField" style="flex-direction:column; align-items:center; min-height:70px;">
        <span class="field-placeholder" id="cashPlaceholder" data-i18n="fees_field_cash">نقدا</span>
        <div id="cashBreakdownWrap" class="cash-breakdown-wrap" style="display:none;"></div>
      </div>
    </div>

    <!-- Other fees panel -->
    <div id="otherPanel" style="display:none;padding-bottom:8px;">
      <!-- ATM withdrawal fees -->
      <div class="fees-other-card">
        <div class="fees-other-title" data-i18n="fees_other_atm_title">رسوم السحب من الصراف الآلي</div>
        <div class="fees-other-item">
          <span class="item-amount" data-i18n="fees_other_atm_post_amount">30 دج/معاملة</span>
          <span class="item-label" data-i18n="fees_other_atm_post_label">السحب من موزع البريد</span>
        </div>
        <div class="fees-other-item">
          <span class="item-amount" data-i18n="fees_other_atm_bank_amount">35 دج/معاملة</span>
          <span class="item-label" data-i18n="fees_other_atm_bank_label">السحب من موزع البنك</span>
        </div>
      </div>
      <!-- Cardless withdrawal -->
      <div class="fees-other-card">
        <div class="fees-other-title" data-i18n="fees_other_nocard_title">رسوم السحب بدون بطاقة من الصراف الآلي</div>
        <div class="fees-other-item">
          <span class="item-amount" data-i18n="fees_other_nocard_amount">80 دج/معاملة</span>
          <span class="item-label" data-i18n="fees_other_nocard_label">السحب بدون بطاقة</span>
        </div>
      </div>
    </div>

  </div><!-- end scroll area -->

  <!-- Bottom Nav (4 tabs) -->
  <nav class="fees-bottom-nav">
    <button class="fees-nav-item active" id="tab-deposit" onclick="switchTab('deposit')">
      <div class="nav-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/>
        </svg>
      </div>
      <span data-i18n="fees_tab_deposit">الدفع</span>
    </button>
    <button class="fees-nav-item" id="tab-transfer" onclick="switchTab('transfer')">
      <div class="nav-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </div>
      <span data-i18n="fees_tab_transfer">التحويل</span>
    </button>
    <button class="fees-nav-item" id="tab-withdrawal" onclick="switchTab('withdrawal')">
      <div class="nav-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="8 12 12 8 16 12"/><line x1="12" y1="16" x2="12" y2="8"/>
        </svg>
      </div>
      <span data-i18n="fees_tab_withdrawal">السحب</span>
    </button>
    <button class="fees-nav-item" id="tab-other" onclick="switchTab('other')">
      <div class="nav-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
      </div>
      <span data-i18n="fees_tab_other">رسوم أخرى</span>
    </button>
  </nav>

</div><!-- end fees-app -->
</div><!-- end app-wrapper -->
<div id="toast" class="toast"></div>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script>
  // ===== FEES CALCULATION (Algérie Poste official rates) =====

  let currentTab = 'deposit';

  function calcDepositFee(amount) {
    if (amount <= 1000)   return 15;
    if (amount <= 5000)   return 20;
    if (amount <= 10000)  return 30;
    if (amount <= 50000)  return 50;
    if (amount <= 100000) return 100;
    return Math.max(150, Math.round(amount * 0.001));
  }

  function calcTransferFee(amount) {
    if (amount <= 10000)  return 30;
    if (amount <= 50000)  return 60;
    if (amount <= 100000) return 100;
    if (amount <= 500000) return 150;
    return Math.max(200, Math.round(amount * 0.0003));
  }

  function calcWithdrawalFee(amount) {
    if (amount <= 10000)  return 30;
    if (amount <= 50000)  return 50;
    if (amount <= 100000) return 80;
    return Math.max(100, Math.round(amount * 0.0008));
  }

  // ===== NUMBER TO ARABIC WORDS =====
  const ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة',
                 'عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر',
                 'ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds = ['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];

  function numToArabic(n) {
    n = Math.round(n);
    if (n === 0) return 'صفر';
    if (n < 0) return 'سالب ' + numToArabic(-n);
    let result = '';
    if (n >= 1000000) {
      const m = Math.floor(n / 1000000);
      if (m === 1) result += 'مليون ';
      else if (m === 2) result += 'مليونان ';
      else if (m <= 10) result += numToArabic(m) + ' ملايين ';
      else result += numToArabic(m) + ' مليون ';
      n %= 1000000;
      if (n > 0) result += 'و';
    }
    if (n >= 1000) {
      const k = Math.floor(n / 1000);
      if (k === 1) result += 'ألف ';
      else if (k === 2) result += 'ألفان ';
      else if (k <= 10) result += numToArabic(k) + ' آلاف ';
      else result += numToArabic(k) + ' ألف ';
      n %= 1000;
      if (n > 0) result += 'و';
    }
    if (n >= 100) {
      result += hundreds[Math.floor(n / 100)] + ' ';
      n %= 100;
      if (n > 0) result += 'و';
    }
    if (n >= 20) {
      result += tens[Math.floor(n / 10)] + ' ';
      n %= 10;
      if (n > 0) result += 'و' + ones[n] + ' ';
    } else if (n > 0) {
      result += ones[n] + ' ';
    }
    return result.trim();
  }

  // ===== NUMBER TO FRENCH WORDS =====
  const onesFr = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf',
    'dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const tensFr = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingts','quatre-vingt'];

  function numToFrench(n) {
    n = Math.round(n);
    if (n === 0) return 'zéro';
    if (n < 0) return 'moins ' + numToFrench(-n);
    let result = '';
    if (n >= 1000000) {
      const m = Math.floor(n / 1000000);
      result += (m === 1 ? 'un million' : numToFrench(m) + ' millions') + ' ';
      n %= 1000000;
      if (n > 0) result += '';
    }
    if (n >= 1000) {
      const k = Math.floor(n / 1000);
      result += (k === 1 ? 'mille' : numToFrench(k) + ' mille') + ' ';
      n %= 1000;
    }
    if (n >= 100) {
      const h = Math.floor(n / 100);
      result += (h === 1 ? 'cent' : onesFr[h] + ' cent') + ' ';
      n %= 100;
    }
    if (n >= 80 && n < 90) {
      result += 'quatre-vingt-' + onesFr[n - 80] + ' ';
    } else if (n >= 70 && n < 80) {
      result += 'soixante-' + onesFr[n - 60] + ' ';
    } else if (n >= 20) {
      const t = Math.floor(n / 10);
      const o = n % 10;
      result += tensFr[t] + (o > 0 ? (o === 1 && t < 8 ? '-et-un' : '-' + onesFr[o]) : '') + ' ';
    } else if (n > 0) {
      result += onesFr[n] + ' ';
    }
    return result.trim();
  }

  // ===== NUMBER TO ENGLISH WORDS =====
  const onesEn = ['','one','two','three','four','five','six','seven','eight','nine',
    'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tensEn = ['','ten','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

  function numToEnglish(n) {
    n = Math.round(n);
    if (n === 0) return 'zero';
    if (n < 0) return 'minus ' + numToEnglish(-n);
    let result = '';
    if (n >= 1000000) {
      result += numToEnglish(Math.floor(n / 1000000)) + ' million ';
      n %= 1000000;
    }
    if (n >= 1000) {
      result += numToEnglish(Math.floor(n / 1000)) + ' thousand ';
      n %= 1000;
    }
    if (n >= 100) {
      result += onesEn[Math.floor(n / 100)] + ' hundred ';
      n %= 100;
    }
    if (n >= 20) {
      result += tensEn[Math.floor(n / 10)] + (n % 10 ? '-' + onesEn[n % 10] : '') + ' ';
    } else if (n > 0) {
      result += onesEn[n] + ' ';
    }
    return result.trim();
  }

  // ===== AMOUNT IN WORDS (locale-aware) — EDIT 6 =====
  function amountInWords(total) {
    const lang = window.APP_LANG || 'ar';
    if (lang === 'fr') {
      return numToFrench(total) + ' dinars algériens (DZD)';
    } else if (lang === 'en') {
      return numToEnglish(total) + ' Algerian dinars (DZD)';
    } else {
      return numToArabic(total) + ' دينار جزائري';
    }
  }

  // ===== CURRENCY LABEL (DZD vs دج) — EDIT 6 =====
  function getCurrencyLabel() {
    const lang = window.APP_LANG || 'ar';
    return (lang === 'fr' || lang === 'en') ? ' DZD' : ' دج';
  }

  // ===== ALGERIAN CURRENCY DATA =====
  const CURRENCY_IMG = {
    2000: { isNote: true,  src: '../images/currency/2000dz.jpg' },
    1000: { isNote: true,  src: '../images/currency/1000dz.jpg' },
    500:  { isNote: true,  src: '../images/currency/500dz.jpg'  },
    200:  { isNote: false, src: '../images/currency/200dz.jpg'  },
    100:  { isNote: false, src: '../images/currency/100dz.jpg'  },
    50:   { isNote: false, src: '../images/currency/50dz.jpg'   },
    20:   { isNote: false, src: '../images/currency/20dz.jpg'   },
    10:   { isNote: false, src: '../images/currency/10dz.jpg'   },
    5:    { isNote: false, src: '../images/currency/5dz.jpg'    },
    2:    { isNote: false, src: '../images/currency/2dz.jpg'    },
    1:    { isNote: false, src: '../images/currency/1dz.jpg'    },
  };

  const DENOMINATIONS = [2000, 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];

  function cashBreakdown(amount) {
    amount = Math.round(amount);
    const parts = [];
    for (const denom of DENOMINATIONS) {
      const count = Math.floor(amount / denom);
      if (count > 0) {
        parts.push({ denom, count });
        amount -= denom * count;
      }
    }
    return parts;
  }

  function renderCashBreakdown(total) {
    const parts = cashBreakdown(total);
    const wrap = document.getElementById('cashBreakdownWrap');
    const ph   = document.getElementById('cashPlaceholder');

    if (!parts.length) {
      wrap.style.display = 'none';
      ph.style.display = 'block';
      return;
    }

    ph.style.display = 'none';
    wrap.style.display = 'flex';

    const ns = localStorage.getItem('appNumeral') || 'eastern';
    wrap.innerHTML = `<div class="cash-breakdown-items">${
      parts.map(({ denom, count }) => {
        const info = CURRENCY_IMG[denom] || CURRENCY_IMG[1];
        const isNote = info.isNote;
        const imgStyle = isNote
          ? 'width:88px;height:55px;object-fit:cover;border-radius:5px;'
          : 'width:60px;height:60px;object-fit:cover;border-radius:50%;';
        return `<div class="cash-item">
          <div style="display:flex;align-items:center;justify-content:center;">
            <img src="${info.src}" alt="${denom} دج" style="${imgStyle}box-shadow:0 2px 6px rgba(0,0,0,0.25);" loading="lazy"/>
          </div>
          <span class="cash-item-count">×${convertNumerals(count, ns)}</span>
          <span class="cash-item-label">${convertNumerals(denom, ns)}${getCurrencyLabel()}</span>
        </div>`;
      }).join('')
    }</div>`;
  }

  // ===== UI =====
  const OP_ICONS = {
    deposit: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="14" rx="2"/>
        <path d="M2 10h20"/><circle cx="12" cy="15" r="2"/>
      </svg>`,
    transfer: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>`,
    withdrawal: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        <line x1="6" y1="15" x2="10" y2="15"/>
      </svg>`,
    other: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
      </svg>`
  };

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.fees-nav-item').forEach(el => {
      el.classList.toggle('active', el.id === 'tab-' + tab);
    });
    document.getElementById('opName').textContent = t('fees_op_' + tab + '_name');
    document.getElementById('opSub').textContent = t('fees_op_' + tab + '_sub');
    document.getElementById('opIcon').innerHTML = OP_ICONS[tab] || OP_ICONS['deposit'];
    const isOther = tab === 'other';
    document.getElementById('feesFields').style.display = isOther ? 'none' : 'flex';
    document.getElementById('otherPanel').style.display = isOther ? 'block' : 'none';
    document.getElementById('opBanner').style.display = 'flex';
    if (!isOther) calcFees();
  }

  function calcFees() {
    const amountRaw = parseFloat(document.getElementById('amountInput').value);
    const amount = isNaN(amountRaw) || amountRaw <= 0 ? 0 : amountRaw;

    let fee = 0;
    if (amount > 0) {
      if (currentTab === 'deposit')    fee = calcDepositFee(amount);
      if (currentTab === 'transfer')   fee = calcTransferFee(amount);
      if (currentTab === 'withdrawal') fee = calcWithdrawalFee(amount);
    }
    const total = amount + fee;

    function setField(placeholderId, valueId, fieldId, text) {
      const ph = document.getElementById(placeholderId);
      const vl = document.getElementById(valueId);
      const fd = document.getElementById(fieldId);
      if (amount > 0) {
        ph.style.display = 'none';
        vl.style.display = 'block';
        vl.textContent = text;
        if (fd) fd.classList.add('has-value');
      } else {
        ph.style.display = 'block';
        vl.style.display = 'none';
        if (fd) fd.classList.remove('has-value');
      }
    }

    const currLabel = getCurrencyLabel();
    const numStyle = localStorage.getItem('appNumeral') || 'eastern';
    setField('feePlaceholder',  'feeValue',  'feeField',  convertNumerals(fee.toLocaleString('ar-DZ'), numStyle) + currLabel);
    setField('totalPlaceholder','totalValue','totalField', convertNumerals(total.toLocaleString('ar-DZ'), numStyle) + currLabel);
    setField('wordsPlaceholder','wordsValue','wordsField', amount > 0 ? amountInWords(total) : '');

    // Cash field — render coin/note visuals
    if (amount > 0) {
      document.getElementById('cashField').classList.add('has-value');
      renderCashBreakdown(total);
    } else {
      document.getElementById('cashField').classList.remove('has-value');
      document.getElementById('cashBreakdownWrap').style.display = 'none';
      document.getElementById('cashPlaceholder').style.display = 'block';
    }
  }

  function copyField(id) {
    const el = document.getElementById(id);
    if (el && el.textContent) copyText(el.textContent);
  }

  // Init
  document.addEventListener('DOMContentLoaded', () => {
    switchTab('deposit');
  });

  // Re-calculate when language changes so DZD/دج and words update
  window.addEventListener('langChanged', () => {
    if (currentTab !== 'other') calcFees();
  });

  // Re-calculate when numeral style changes so numbers update
  window.addEventListener('numeralChanged', () => {
    if (currentTab !== 'other') calcFees();
  });
</script>
</body>
</html>
