<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="fees_page_title">حاسبة الرسوم - MY CCP</title>
  <meta name="theme-color" content="#1e3a8a"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    /* ===== FEES PAGE SPECIFIC ===== */
    .op-row {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .op-row::-webkit-scrollbar { display: none; }

    .op-btn {
      flex: 1;
      min-width: 90px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .op-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
    }
    .op-btn svg { flex-shrink: 0; }

    /* نتائج */
    .result-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .fee-cards-row {
      display: flex;
      gap: 8px;
    }
    .fee-card {
      flex: 1;
      background: var(--surface2);
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1.5px solid var(--border);
    }
    .fee-card.total {
      border-color: var(--primary);
      background: rgba(37,99,235,0.08);
    }
    .fee-card-label {
      font-size: 0.72rem;
      color: var(--text2);
      font-weight: 600;
    }
    .fee-card.total .fee-card-label { color: var(--primary); }
    .fee-card-value {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text1);
      direction: ltr;
    }
    .fee-card.total .fee-card-value { color: var(--primary); }

    /* قسم الأحرف */
    .section-box {
      background: var(--surface2);
      border-radius: 16px;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }
    .section-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: var(--surface3, var(--surface2));
      border-bottom: 1px solid var(--border);
    }
    .section-box-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text1);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-tabs {
      display: flex;
      gap: 4px;
    }
    .words-tab, .notes-tab {
      padding: 5px 10px;
      border-radius: 8px;
      border: none;
      background: var(--surface);
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .words-tab.active, .notes-tab.active {
      background: var(--primary);
      color: #fff;
    }
    .section-box-body {
      padding: 14px;
    }
    .words-text-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .words-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text1);
      line-height: 1.6;
      direction: rtl;
    }
    .copy-words-btn {
      flex-shrink: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px;
      cursor: pointer;
      color: var(--text2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .copy-words-btn:active { transform: scale(0.9); }

    /* قسم النقد */
    .notes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .note-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 80px;
      gap: 2px;
    }
    .note-denom {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .note-denom span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text2);
    }
    .note-count {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text2);
    }
    .note-sub {
      font-size: 0.72rem;
      color: var(--text3, var(--text2));
      direction: ltr;
    }
    .note-empty {
      color: var(--text2);
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
      padding: 8px 0;
    }

    /* lang selector in words section */
    .lang-select-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .lang-select-label {
      font-size: 0.75rem;
      color: var(--text2);
      font-weight: 600;
    }
    .lang-mini-btn {
      padding: 4px 10px;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lang-mini-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* input clear */
    .amount-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .amount-input-wrap input {
      flex: 1;
      padding-inline-end: 44px;
    }
    .amount-clear {
      position: absolute;
      inset-inline-end: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      padding: 4px;
    }

    /* bottom nav active */
    .nav-item.fees-active {
      color: var(--primary);
    }
    .nav-item.fees-active svg {
      stroke: var(--primary);
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-title" data-i18n="fees_page_title">حاسبة الرسوم</div>
    <div class="header-icons">
      <button class="header-btn" onclick="navigateTo('../index.html')" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="header-btn" id="menuBtn" onclick="openSidebar()" aria-label="menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div class="animate-in" style="display:flex;flex-direction:column;gap:12px;">

      <!-- اختيار نوع العملية -->
      <div class="input-group" style="padding-bottom:4px;">
        <span class="input-label" data-i18n="op_type">نوع العملية</span>
        <div class="op-row" style="margin-top:8px;">
          <button class="op-btn active" data-op="withdrawal" onclick="selectOp('withdrawal')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span data-i18n="op_withdrawal">سحب</span>
          </button>
          <button class="op-btn" data-op="transfer" onclick="selectOp('transfer')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            <span data-i18n="op_transfer">تحويل</span>
          </button>
          <button class="op-btn" data-op="deposit" onclick="selectOp('deposit')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
            <span data-i18n="op_deposit">دفع</span>
          </button>
        </div>
      </div>

      <!-- المبلغ -->
      <div class="input-group">
        <span class="input-label" data-i18n="amount_dzd">المبلغ</span>
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <input type="tel" id="amountInput" data-i18n-ph="enter_amount_ph" placeholder="أدخل المبلغ بالدينار الجزائري" inputmode="numeric" autocomplete="off" style="padding-inline-end:44px;"/>
        <button class="amount-clear" id="amountClearBtn" onclick="clearFeeAmount()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </button>
        <span style="position:absolute;inset-inline-end:44px;top:50%;transform:translateY(-50%);font-size:0.78rem;color:var(--text2);font-weight:700;pointer-events:none;">دج</span>
      </div>

      <!-- قسم النتائج -->
      <div class="result-section" id="resultSection" style="display:none;">

        <!-- بطاقات القيم -->
        <div class="fee-cards-row">
          <div class="fee-card">
            <span class="fee-card-label" data-i18n="amount_dzd">المبلغ</span>
            <span class="fee-card-value" id="feeAmount">0 دج</span>
          </div>
          <div class="fee-card">
            <span class="fee-card-label" data-i18n="fee_label">الرسم</span>
            <span class="fee-card-value" id="feeValue" style="color:var(--success,#22c55e);">0 دج</span>
          </div>
          <div class="fee-card total">
            <span class="fee-card-label" data-i18n="total_label">المجموع</span>
            <span class="fee-card-value" id="feeTotal">0 دج</span>
          </div>
        </div>

        <!-- قسم بالأحرف -->
        <div class="section-box">
          <div class="section-box-header">
            <div class="section-box-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
              <span data-i18n="in_words">بالأحرف</span>
            </div>
            <div class="section-tabs">
              <button class="words-tab" data-target="amount" data-i18n="tab_amount" onclick="selectWordsTarget('amount')">المبلغ</button>
              <button class="words-tab" data-target="fee" data-i18n="tab_fee" onclick="selectWordsTarget('fee')">الرسم</button>
              <button class="words-tab active" data-target="total" data-i18n="tab_total" onclick="selectWordsTarget('total')">المجموع</button>
            </div>
          </div>
          <div class="section-box-body">
            <div class="words-text-row">
              <span class="words-text" id="wordsText">---</span>
              <button class="copy-words-btn" onclick="copyWords()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- قسم النقد -->
        <div class="section-box">
          <div class="section-box-header">
            <div class="section-box-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
              <span data-i18n="in_cash">نقدًا</span>
            </div>
            <div class="section-tabs">
              <button class="notes-tab active" data-target="amount" data-i18n="tab_amount" onclick="selectNotesTarget('amount')">المبلغ</button>
              <button class="notes-tab" data-target="fee" data-i18n="tab_fee" onclick="selectNotesTarget('fee')">الرسم</button>
              <button class="notes-tab" data-target="total" data-i18n="tab_total" onclick="selectNotesTarget('total')">المجموع</button>
            </div>
          </div>
          <div class="section-box-body">
            <div class="notes-grid" id="notesContainer">
              <div class="note-empty">---</div>
            </div>
          </div>
        </div>

      </div>
      <!-- نهاية النتائج -->

    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="navigateTo('../index.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="home">الرئيسية</span>
    </button>
    <button class="nav-item fees-active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span data-i18n="tool_fees">الرسوم</span>
    </button>
    <button class="nav-item" onclick="navigateTo('../pages/settings.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </nav>
</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="../icons/icon-192.png" alt="MY CCP" class="sidebar-logo"/>
    <div class="sidebar-app-name">MY CCP</div>
    <div class="sidebar-version" data-i18n="free_version">النسخة المجانية</div>
  </div>
  <div class="sidebar-menu">
    <div class="sidebar-section-title" data-i18n="tools">الأدوات</div>
    <button class="sidebar-item" onclick="navigateTo('../index.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span data-i18n="tool_ccp_rip">CCP To RIP</span>
    </button>
    <button class="sidebar-item active" onclick="navigateTo('fees.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span data-i18n="tool_fees">حاسبة الرسوم</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('transfer.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span data-i18n="tool_transfer">مدير الحوالات</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('cheque.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span data-i18n="tool_cheque">ملء الصك البريدي</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('history.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      <span data-i18n="sidebar_history">السجل</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('settings.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="sidebar_settings">إعدادات التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('about.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span data-i18n="about">حول التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('privacy.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="privacy">سياسة الخصوصية</span>
    </button>
  </div>
</aside>

<div id="toast" class="toast"></div>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/fees.js"></script>
</body>
</html>
