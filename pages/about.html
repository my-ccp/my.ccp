<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MY CCP – حول التطبيق</title>
  <meta name="theme-color" content="#1e3a8a"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="icon" type="image/png" href="../icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="app">

  <!-- SUBPAGE HEADER -->
  <header class="subpage-header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div class="subpage-title" data-i18n="about">حول التطبيق</div>
    <div style="width:42px;"></div>
  </header>

  <main class="main-content subpage-content">
    <!-- Logo -->
    <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 24px;">
      <img src="../icons/icon-192.png" alt="MY CCP" style="width:90px;height:90px;border-radius:22px;box-shadow:var(--shadow);"/>
      <div style="font-size:1.5rem;font-weight:800;margin-top:12px;color:var(--accent);">MY <span style="color:var(--accent-green);">CCP</span></div>
      <div style="font-size:0.82rem;color:var(--text2);margin-top:4px;" data-i18n="free_version">النسخة المجانية</div>
    </div>

    <!-- Description -->
    <div class="info-section">
      <p data-i18n="about_desc">تطبيق MY CCP يساعدك على تحويل رقم حسابك البريدي CCP إلى رقم RIP (ريب) بكل سهولة وسرعة.</p>
    </div>

    <!-- Features -->
    <div class="info-section">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span data-i18n="about_features">مميزات التطبيق</span>
      </h3>
      <ul>
        <li data-i18n="feat1">تحويل فوري من CCP إلى RIP</li>
        <li data-i18n="feat2">حفظ الحسابات محليًا دون إنترنت</li>
        <li data-i18n="feat3">واجهة سهلة وبسيطة</li>
        <li data-i18n="feat4">متعدد اللغات</li>
        <li data-i18n="feat5">الوضع الليلي والنهاري</li>
      </ul>
    </div>

    <!-- Version info -->
    <div class="info-section">
      <div class="account-row">
        <span class="account-label" data-i18n="version">الإصدار</span>
        <span class="account-value">1.0.0</span>
      </div>
    </div>
  </main>

</div>

<div id="toast" class="toast"></div>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
