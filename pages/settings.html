<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MY CCP – الإعدادات</title>
  <meta name="theme-color" content="#1e3a8a"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="icon" type="image/png" href="../icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="app-wrapper">
<div id="app">

  <!-- SUBPAGE HEADER -->
  <header class="subpage-header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div class="subpage-title" data-i18n="settings">الإعدادات</div>
    <div style="width:42px;"></div>
  </header>

  <!-- MAIN -->
  <main class="main-content subpage-content">

    <!-- Language -->
    <div class="settings-section">
      <div class="settings-item">
        <div class="settings-item-left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="settings-item-label" data-i18n="language">اللغة</span>
        </div>
        <div class="lang-select-wrapper">
          <button class="lang-select-btn" id="langSelectBtn" onclick="toggleLangDropdown()">
            <span class="lang-select-left">
              <span class="flag" id="selectedFlag">🇩🇿</span>
              <span id="selectedLangName">العربية</span>
            </span>
            <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-dropdown-item" data-lang="ar" onclick="selectLang('ar')">
              <span class="flag">🇩🇿</span>
              <span>العربية</span>
              <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="lang-dropdown-item" data-lang="fr" onclick="selectLang('fr')">
              <span class="flag">🇫🇷</span>
              <span>Français</span>
              <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="lang-dropdown-item" data-lang="en" onclick="selectLang('en')">
              <span class="flag">🇺🇸</span>
              <span>English</span>
              <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Appearance -->
    <div class="settings-section">
      <!-- Dark mode toggle (light ↔ dark) -->
      <div class="settings-item">
        <div class="settings-item-left">
          <svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <div>
            <div class="settings-item-label" id="themeModeLabel" data-i18n="dark_mode">الوضع الليلي</div>
          </div>
        </div>
        <button class="toggle" id="themeToggle" onclick="confirmToggleTheme()"></button>
      </div>
      <!-- Theme palette chooser -->
      <div class="settings-item" style="flex-direction:column;align-items:flex-start;gap:10px;padding-top:4px;">
        <div class="settings-item-left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
          <div class="settings-item-label" data-i18n="theme_style">نمط الألوان</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;padding-inline-start:4px;">
          <button class="theme-swatch" id="swatch-light" onclick="selectTheme('light')" title="فاتح" style="background:linear-gradient(135deg,#f0f4ff,#e8edf8);border:2px solid #2563eb;">
            <span style="color:#1e3a8a;font-size:0.7rem;font-weight:700;" data-i18n="theme_light">فاتح</span>
          </button>
          <button class="theme-swatch" id="swatch-dark" onclick="selectTheme('dark')" title="داكن" style="background:linear-gradient(135deg,#000000,#0d1a50);">
            <span style="color:#60a5fa;font-size:0.7rem;font-weight:700;" data-i18n="theme_dark">داكن</span>
          </button>
          <button class="theme-swatch" id="swatch-yellow" onclick="selectTheme('yellow')" title="بريدي" style="background:#FFD200;border:2px solid #1b4fa8;">
            <span style="color:#1b4fa8;font-size:0.7rem;font-weight:700;" data-i18n="theme_yellow">بريدي</span>
          </button>
          <button class="theme-swatch" id="swatch-black" onclick="selectTheme('black')" title="ليلي" style="background:#050505;border:2px solid #333;">
            <span style="color:#ffffff;font-size:0.7rem;font-weight:700;" data-i18n="theme_black">ليلي</span>
          </button>
          <button class="theme-swatch" id="swatch-white" onclick="selectTheme('white')" title="نهاري" style="background:#ffffff;border:2px solid #aaa;">
            <span style="color:#000000;font-size:0.7rem;font-weight:700;" data-i18n="theme_white">نهاري</span>
          </button>
          <button class="theme-swatch" id="swatch-emerald" onclick="selectTheme('emerald')" title="زمردي" style="background:linear-gradient(135deg,#064e3b,#059669);border:2px solid #34d399;">
            <span style="color:#34d399;font-size:0.7rem;font-weight:700;" data-i18n="theme_emerald">زمردي</span>
          </button>
          <button class="theme-swatch" id="swatch-slate" onclick="selectTheme('slate')" title="فحمي" style="background:linear-gradient(135deg,#0f172a,#334155);border:2px solid #60a5fa;">
            <span style="color:#60a5fa;font-size:0.7rem;font-weight:700;" data-i18n="theme_slate">فحمي</span>
          </button>
        </div>
      </div>
    </div>
    <style>
      .theme-swatch {
        width: 56px; height: 56px; border-radius: 50%; border: 2px solid transparent;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: transform 0.15s, border-color 0.2s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      .theme-swatch:hover { transform: scale(1.06); }
      .theme-swatch.active-swatch { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(37,99,235,0.25); }
    </style>

    <!-- Font Size -->
    <div class="settings-section">
      <div class="settings-item" style="flex-direction:column;align-items:stretch;gap:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="settings-item-left">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            <div class="settings-item-label" data-i18n="font_size">حجم الخط</div>
          </div>
          <span id="fontScaleLabel" style="font-size:0.9rem;font-weight:700;color:var(--accent);min-width:36px;text-align:center;">80%</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:0 2px;">
          <span id="fontSizeSampleSmall" style="font-size:0.75rem;color:var(--text2);font-weight:700;">أ</span>
          <input type="range" id="fontScaleSlider"
            min="0.5" max="1.4" step="0.05" value="0.8"
            style="flex:1;accent-color:var(--accent);height:4px;cursor:pointer;"
            oninput="onFontScaleChange(this.value)"/>
          <span id="fontSizeSampleLarge" style="font-size:1.1rem;color:var(--text2);font-weight:700;">أ</span>
        </div>
      </div>
    </div>

    <!-- Data & Privacy -->
    <div class="settings-section">

      <!-- Allow History Toggle -->
      <div class="settings-item">
        <div class="settings-item-left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          <div class="settings-item-label" data-i18n="allow_history">السماح بحفظ سجل العمليات</div>
        </div>
        <button class="toggle on" id="historyToggle" onclick="toggleAllowHistory()"></button>
      </div>

      <!-- Clear Data Button -->
      <div class="settings-item">
        <div class="settings-item-left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          <div class="settings-item-label" data-i18n="clear_data">مسح بيانات التطبيق</div>
        </div>
        <button class="btn-outline-sm" id="clearDataBtn" onclick="confirmClearData()" data-i18n="clear_data_btn">مسح</button>
      </div>
    </div>

  </main>

  <!-- Clear Data Confirm Modal -->
  <div class="modal-overlay" id="clearDataModal" style="display:none;">
    <div class="modal">
      <div class="modal-title" data-i18n="confirm_clear_data">مسح البيانات</div>
      <div class="modal-msg" data-i18n="confirm_clear_data_msg">هل أنت متأكد من مسح جميع بيانات التطبيق؟</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeClearDataModal()" data-i18n="cancel">إلغاء</button>
        <button class="modal-btn confirm" onclick="executeClearData()" data-i18n="confirm">تأكيد</button>
      </div>
    </div>
  </div>

</div>

</div><!-- end #app-wrapper -->
<div id="toast" class="toast"></div>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script>
  const LANG_META = {
    ar: { flag: '🇩🇿', name: 'العربية' },
    fr: { flag: '🇫🇷', name: 'Français' },
    en: { flag: '🇺🇸', name: 'English' }
  };

  function toggleLangDropdown() {
    const btn = document.getElementById('langSelectBtn');
    const dd  = document.getElementById('langDropdown');
    const open = dd.classList.toggle('open');
    btn.classList.toggle('open', open);
  }

  function selectLang(lang) {
    // Close dropdown
    document.getElementById('langDropdown').classList.remove('open');
    document.getElementById('langSelectBtn').classList.remove('open');

    if (lang === window.APP_LANG) return;
    applyLang(lang, true);
    updateLangDisplay();
    updateFontSizeSamples();
  }

  function updateLangDisplay() {
    const lang = window.APP_LANG || 'ar';
    const meta = LANG_META[lang] || LANG_META['ar'];
    document.getElementById('selectedFlag').textContent = meta.flag;
    document.getElementById('selectedLangName').textContent = meta.name;
    // Mark active item
    document.querySelectorAll('.lang-dropdown-item').forEach(item => {
      item.classList.toggle('active', item.getAttribute('data-lang') === lang);
    });
  }

  function confirmToggleTheme() {
    toggleTheme();
    updateThemeToggle();
    updateThemeLabel();
  }

  function updateThemeLabel() {
    const isNight = document.documentElement.getAttribute('data-theme') === 'black';
    const label = document.getElementById('themeModeLabel');
    if (!label) return;
    const lang = window.APP_LANG || 'ar';
    const darkThemes = ['dark', 'black', 'emerald', 'slate'];
    const isNightMode = darkThemes.includes(document.documentElement.getAttribute('data-theme'));
    // Show the current mode name using translation keys
    label.textContent = isNight ? t('dark_mode') : t('day_mode');
    label.removeAttribute('data-i18n');

    // Switch icon: night now → show moon; day now → show sun
    const icon = document.getElementById('themeIcon');
    if (!icon) return;
    if (isNight) {
      // Show moon icon (currently in night mode)
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    } else {
      // Show sun icon (currently in day mode)
      icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    }
  }

  // ---- Allow History Toggle ----
  function toggleAllowHistory() {
    const current = localStorage.getItem('allowHistory') !== 'false';
    const newVal = !current;
    localStorage.setItem('allowHistory', newVal ? 'true' : 'false');
    updateHistoryToggle();
  }

  function updateHistoryToggle() {
    const btn = document.getElementById('historyToggle');
    if (!btn) return;
    const enabled = localStorage.getItem('allowHistory') !== 'false';
    btn.classList.toggle('on', enabled);
  }

  // ---- Clear Data ----
  function confirmClearData() {
    const modal = document.getElementById('clearDataModal');
    modal.style.display = 'flex';
    // Use setTimeout so display:flex applies before adding .open (triggers CSS transition)
    setTimeout(() => modal.classList.add('open'), 10);
  }

  function closeClearDataModal() {
    const modal = document.getElementById('clearDataModal');
    modal.classList.remove('open');
    // Wait for transition to finish before hiding
    setTimeout(() => { modal.style.display = 'none'; }, 350);
  }

  function executeClearData() {
    // Clear all localStorage
    localStorage.clear();
    closeClearDataModal();
    // Re-apply defaults so app doesn't break
    localStorage.setItem('allowHistory', 'true');
    showToast(t('data_cleared'));
    // Reload after short delay
    setTimeout(() => location.reload(), 1200);
  }

  // Close dropdown on outside click
  document.addEventListener('click', e => {
    const wrapper = document.querySelector('.lang-select-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('langDropdown').classList.remove('open');
      document.getElementById('langSelectBtn').classList.remove('open');
    }
  });

  // ---- Font Scale ----
  function onFontScaleChange(val) {
    const scale = parseFloat(val);
    applyFontScale(scale, true);
    updateFontScaleUI(scale);
  }

  function updateFontScaleUI(scale) {
    const slider = document.getElementById('fontScaleSlider');
    const label  = document.getElementById('fontScaleLabel');
    if (slider) slider.value = scale;
    if (label)  label.textContent = Math.round(scale * 100) + '%';
  }

  function updateFontSizeSamples() {
    const lang = window.APP_LANG || 'ar';
    const sample = (lang === 'ar') ? 'أ' : 'A';
    const small = document.getElementById('fontSizeSampleSmall');
    const large = document.getElementById('fontSizeSampleLarge');
    if (small) small.textContent = sample;
    if (large) large.textContent = sample;
    // Also translate clear button
    const clearBtn = document.getElementById('clearDataBtn');
    if (clearBtn) clearBtn.textContent = t('clear_data_btn');
  }

  // ---- Theme Palette ----
  function selectTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    window.APP_THEME = theme;
    localStorage.setItem('theme', theme);
    appChannel.postMessage({ type: 'theme', value: theme });
    updateSwatchActive();
    updateThemeToggle();
    updateThemeLabel();
  }

  function updateSwatchActive() {
    const current = window.APP_THEME || 'light';
    document.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active-swatch', el.id === 'swatch-' + current);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateThemeToggle();
    updateLangDisplay();
    updateThemeLabel();
    updateHistoryToggle();
    updateSwatchActive();
    // Init font scale slider — default 0.8 (80%)
    const stored = localStorage.getItem('fontScale');
    const scale = stored ? parseFloat(stored) : 0.8;
    if (!stored) {
      localStorage.setItem('fontScale', '0.8');
      applyFontScale(0.8, false);
    }
    updateFontScaleUI(scale);
    updateFontSizeSamples();
  });
</script>
</body>
</html>
