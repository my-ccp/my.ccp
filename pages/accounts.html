<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MY CCP – الحسابات</title>
  <meta name="theme-color" content="#1e3a8a"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="icon" type="image/png" href="../icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="app-wrapper">
<div id="app">

  <!-- SUBPAGE HEADER -->
  <header class="subpage-header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div class="subpage-title" data-i18n="saved_accounts">الحسابات المحفوظة</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="subpage-action-btn" id="searchToggleBtn" onclick="toggleSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="subpage-action-btn" id="menuDotsBtn" onclick="openHeaderMenu(event)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content subpage-content">
    <div id="searchBar" class="search-bar" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" data-i18n-ph="search_placeholder" placeholder="بحث..." oninput="renderAccounts()"/>
    </div>

    <!-- Selection bar -->
    <div class="selection-bar" id="selectionBar">
      <span id="selectionCount">0 <span data-i18n="selected_count">محدد</span></span>
      <div class="selection-bar-actions">
        <button class="selection-bar-btn" onclick="cancelSelection()" data-i18n="cancel_selection">إلغاء</button>
        <button class="selection-bar-btn danger" onclick="deleteSelected()" data-i18n="delete_selected">حذف</button>
      </div>
    </div>

    <div class="accounts-header" id="accountsHeader"></div>
    <div id="accountsList"></div>
  </main>

</div>

<!-- DROPDOWN MENU (header 3-dots) -->
<div class="dropdown-menu" id="headerDropdown" style="display:none;">
  <button class="dropdown-item" onclick="startSelectAll(); closeHeaderMenu();">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 12 11 14 15 10"/></svg>
    <span data-i18n="select_all">تحديد الكل</span>
  </button>
  <button class="dropdown-item" onclick="importAccounts(); closeHeaderMenu();">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span data-i18n="import_accounts">استيراد الحسابات</span>
  </button>
  <button class="dropdown-item" onclick="exportAccounts(); closeHeaderMenu();">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span data-i18n="export_accounts">تصدير الحسابات</span>
  </button>
  <div class="dropdown-divider"></div>
  <button class="dropdown-item danger" onclick="clearAllAccounts(); closeHeaderMenu();">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    <span data-i18n="clear_accounts">مسح الحسابات</span>
  </button>
</div>

<!-- Per-card dropdown -->
<div class="dropdown-menu" id="cardDropdown" style="display:none;">
  <button class="dropdown-item" id="ddCopy" onclick="ddAction('copy',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span data-i18n="copy">نسخ الريب</span>
  </button>
  <button class="dropdown-item" id="ddQR" onclick="ddAction('qr',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="5" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="16" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="5" y="16" width="3" height="3" fill="currentColor" stroke="none"/><rect x="14" y="14" width="3" height="3" fill="currentColor" stroke="none"/><rect x="18" y="14" width="3" height="3" fill="currentColor" stroke="none"/><rect x="14" y="18" width="3" height="3" fill="currentColor" stroke="none"/><rect x="18" y="18" width="3" height="3" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="generate_qr">إنشاء QR</span>
  </button>
  <button class="dropdown-item" id="ddShare" onclick="ddAction('share',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    <span data-i18n="share">مشاركة</span>
  </button>
  <button class="dropdown-item" id="ddEdit" onclick="ddAction('edit',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    <span data-i18n="edit">تعديل الاسم</span>
  </button>
  <button class="dropdown-item" id="ddFav" onclick="ddAction('fav',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
    <span id="ddFavLabel">إضافة للمفضلة</span>
  </button>
  <button class="dropdown-item" id="ddSelect" onclick="ddAction('select',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 12 11 14 15 10"/></svg>
    <span data-i18n="select_all">تحديد</span>
  </button>
  <div class="dropdown-divider"></div>
  <button class="dropdown-item danger" id="ddDelete" onclick="ddAction('delete',event)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    <span data-i18n="delete">حذف</span>
  </button>
</div>

<!-- IMPORT FILE INPUT -->
<input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleImportFile(event)"/>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="confirm_delete">حذف الحساب</div>
    <p style="color:var(--text2);font-size:0.9rem;" data-i18n="confirm_delete_msg">هل أنت متأكد من حذف هذا الحساب؟</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeDeleteModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-danger" onclick="confirmDelete()" style="flex:1;" data-i18n="delete">حذف</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="edit">تعديل</div>
    <div class="input-group">
      <span class="input-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <input type="text" id="editNameInput" data-i18n-ph="name_placeholder" placeholder="اللقب و الإسم"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeEditModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-success" onclick="confirmEdit()" style="flex:1;" data-i18n="confirm">تأكيد</button>
    </div>
  </div>
</div>


<!-- QR CODE MODAL -->
<div class="modal-overlay" id="qrModal">
  <div class="modal" style="text-align:center;">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="qr_modal_title">QR Code الريب</div>
    <div id="qrCanvas" style="margin:16px auto;display:flex;justify-content:center;align-items:center;"></div>
    <p id="qrRipText" style="color:var(--text2);font-size:0.78rem;letter-spacing:1px;margin-bottom:12px;direction:ltr;"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeQRModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-success" onclick="downloadQR()" style="flex:1;" data-i18n="download_qr">تحميل</button>
    </div>
  </div>
</div>
</div><!-- end #app-wrapper -->
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script>
  let pendingDeleteId = null;
  let pendingEditId = null;
  let activeCardId = null;
  let selectionMode = false;
  let selectedIds = new Set();

  // ===== FORMAT DATE like 22.11.2026 15:04 =====
  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      // Handle fr-DZ locale string like "22/11/2026, 15:04:31"
      const frMatch = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2})/);
      if (frMatch) {
        return `${frMatch[1]}.${frMatch[2]}.${frMatch[3]} ${frMatch[4]}:${frMatch[5]}`;
      }
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2,'0');
      const min = String(d.getMinutes()).padStart(2,'0');
      return `${dd}.${mm}.${yyyy} ${hh}:${min}`;
    } catch { return dateStr; }
  }

  function toggleSearch() {
    const bar = document.getElementById('searchBar');
    const hidden = bar.style.display === 'none';
    bar.style.display = hidden ? 'flex' : 'none';
    if (hidden) document.getElementById('searchInput').focus();
    else { document.getElementById('searchInput').value = ''; renderAccounts(); }
  }

  // ===== TOGGLE FAVORITE =====
  function toggleFavorite(id, e) {
    if (e) e.stopPropagation();
    const acc = getAccounts().find(a => a.id == id);
    if (!acc) return;
    const newFav = !acc.favorite;
    updateAccount(id, { favorite: newFav });
    showToast(newFav ? t('add_to_fav') : t('remove_from_fav'));
  
  // ===== QR CODE =====
  let _qrInstance = null;

  function openQRModal(rip) {
    document.getElementById('qrRipText').textContent = rip;
    const canvas = document.getElementById('qrCanvas');
    canvas.innerHTML = '';
    _qrInstance = null;
    // Use RIP as QR data so same RIP always = same QR
    try {
      _qrInstance = new QRCode(canvas, {
        text: rip,
        width: 220,
        height: 220,
        colorDark: getComputedStyle(document.documentElement).getPropertyValue('--text1').trim() || '#000000',
        colorLight: getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim() || '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(err) {
      // Fallback: black on white
      _qrInstance = new QRCode(canvas, { text: rip, width: 220, height: 220 });
    }
    document.getElementById('qrModal').classList.add('active');
  }

  function closeQRModal() {
    document.getElementById('qrModal').classList.remove('active');
  }

  function downloadQR() {
    const canvas = document.querySelector('#qrCanvas canvas');
    const img = document.querySelector('#qrCanvas img');
    let dataUrl;
    if (canvas) {
      dataUrl = canvas.toDataURL('image/png');
    } else if (img) {
      // QRCodeJS sometimes renders an <img>; redraw on a temp canvas
      const tmp = document.createElement('canvas');
      tmp.width = img.naturalWidth || 220;
      tmp.height = img.naturalHeight || 220;
      const ctx = tmp.getContext('2d');
      ctx.drawImage(img, 0, 0);
      dataUrl = tmp.toDataURL('image/png');
    } else { return; }
    const rip = document.getElementById('qrRipText').textContent || 'rip';
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'QR_' + rip.replace(/\s/g,'') + '.png';
    a.click();
  }

  document.getElementById('qrModal').addEventListener('click', function(e) {
    if (e.target === this) closeQRModal();
  });

  renderAccounts();
  }

  // ===== RENDER =====
  function renderAccounts() {
    let all = getAccounts();
    // Sort: favorites first
    all = [...all.filter(a => a.favorite), ...all.filter(a => !a.favorite)];

    const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const filtered = query ? all.filter(a =>
      a.name.toLowerCase().includes(query) ||
      a.ccp.includes(query) ||
      a.rip.includes(query)
    ) : all;

    const header = document.getElementById('accountsHeader');
    header.textContent = t('total_accounts') + ' ' + all.length;

    const list = document.getElementById('accountsList');
    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <p data-i18n="no_accounts">${t('no_accounts')}</p>
          <p style="font-size:0.8rem;" data-i18n="no_accounts_sub">${t('no_accounts_sub')}</p>
        </div>`;
      return;
    }

    const ripFormatted = (rip) => {
      if (!rip || rip.length < 20) return rip;
      return rip.slice(0,2)+' '+rip.slice(2,7)+' '+rip.slice(7,17)+' '+rip.slice(17);
    };

    list.innerHTML = filtered.map((a, i) => {
      const isSelected = selectedIds.has(a.id);
      const isFav = !!a.favorite;
      return `
      <div class="account-card animate-in ${isSelected ? 'selected' : ''}" id="card-${a.id}" style="animation-delay:${i*0.04}s;position:relative;">
        <!-- Checkbox -->
        <div class="account-checkbox ${selectionMode ? 'visible' : ''} ${isSelected ? 'checked' : ''}"
             id="chk-${a.id}" onclick="toggleSelect(${a.id})">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>

        <!-- Card Top: chip + name | CCP number side by side -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;">
          <!-- Left: chip + name -->
          <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
            <!-- EMV chip icon -->
            <svg width="28" height="21" viewBox="0 0 34 26" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
              <rect x="1" y="1" width="32" height="24" rx="4" fill="#d4af37" stroke="#b8960a" stroke-width="1"/>
              <line x1="12" y1="1" x2="12" y2="25" stroke="#b8960a" stroke-width="1"/>
              <line x1="22" y1="1" x2="22" y2="25" stroke="#b8960a" stroke-width="1"/>
              <line x1="1" y1="9" x2="33" y2="9" stroke="#b8960a" stroke-width="1"/>
              <line x1="1" y1="17" x2="33" y2="17" stroke="#b8960a" stroke-width="1"/>
              <rect x="12" y="9" width="10" height="8" rx="1" fill="#c9a227" stroke="#b8960a" stroke-width="0.5"/>
            </svg>
            <span style="font-size:1rem;font-weight:800;color:#ffffff;letter-spacing:0.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.name}</span>
          </div>
          <!-- Right: CCP number -->
          <div style="text-align:end;flex-shrink:0;">
            <div style="font-size:0.65rem;color:rgba(255,255,255,0.65);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px;">CCP</div>
            <div style="font-size:1.1rem;font-weight:800;color:#ffffff;direction:ltr;unicode-bidi:bidi-override;letter-spacing:1.5px;">${a.ccp}</div>
          </div>
        </div>

        <!-- Keys row -->
        <div class="key-row" style="margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
            <span style="font-size:0.8rem;color:rgba(255,255,255,0.7);">${t('ccp_key_label')}</span>
            <span class="key-badge">${a.ccpKey}</span>
          </div>
          <span class="key-row-sep" style="color:rgba(255,255,255,0.3);">|</span>
          <div style="display:flex;align-items:center;gap:5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
            <span style="font-size:0.8rem;color:rgba(255,255,255,0.7);">${t('rip_key_label')}</span>
            <span class="key-badge" style="background:rgba(255,180,0,0.2);color:#ffd966;border-color:rgba(255,180,0,0.3);">${a.ripKey}</span>
          </div>
        </div>

        <!-- RIP number - highlighted -->
        <div style="background:rgba(0,0,0,0.25);border-radius:10px;padding:7px 12px;margin-bottom:8px;">
          <div style="font-size:0.75rem;color:rgba(255,255,255,0.6);margin-bottom:2px;letter-spacing:1.5px;">RIP</div>
          <div class="rip-value" style="font-size:1.1rem;font-weight:800;color:#93c5fd;direction:ltr;unicode-bidi:bidi-override;letter-spacing:1.5px;">${ripFormatted(a.rip)}</div>
        </div>

        <!-- Actions -->
        <div class="account-actions">
          <!-- Star / favorite button (bottom-start, inside actions row) -->
          <button onclick="toggleFavorite(${a.id}, event)"
            class="fav-action-btn"
            style="background:none;border:none;cursor:pointer;padding:4px 6px 4px 2px;line-height:1;display:flex;align-items:center;"
            title="${isFav ? t('remove_from_fav') : t('add_to_fav')}">
            <svg width="17" height="17" viewBox="0 0 24 24"
              fill="${isFav ? '#f59e0b' : 'none'}"
              stroke="${isFav ? '#f59e0b' : 'rgba(255,255,255,0.45)'}"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </button>
          <span class="account-date">${formatDate(a.date)}</span>
          <button class="dots-btn" onclick="openCardMenu(event, ${a.id})" title="...">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="1.2" fill="rgba(255,255,255,0.8)" stroke="none"/>
              <circle cx="12" cy="12" r="1.2" fill="rgba(255,255,255,0.8)" stroke="none"/>
              <circle cx="12" cy="19" r="1.2" fill="rgba(255,255,255,0.8)" stroke="none"/>
            </svg>
          </button>
        </div>
      </div>
    `}).join('');
  }

  // ===== POSITION DROPDOWN (smart: stays inside viewport) =====
  function positionDropdown(menu, triggerRect) {
    menu.style.display = 'block';
    // Reset first to measure
    menu.style.left = '0px';
    menu.style.top = '0px';
    menu.style.right = 'auto';
    menu.style.bottom = 'auto';

    const menuW = menu.offsetWidth || 200;
    const menuH = menu.offsetHeight || 200;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Horizontal: align to right edge of trigger, clamp inside screen
    let left = triggerRect.right - menuW;
    if (left < 8) left = 8;
    if (left + menuW > vw - 8) left = vw - menuW - 8;

    // Vertical: below trigger if space, else above
    let top;
    const spaceBelow = vh - triggerRect.bottom - 8;
    if (spaceBelow >= menuH || spaceBelow >= 150) {
      top = triggerRect.bottom + 4;
    } else {
      top = triggerRect.top - menuH - 4;
      if (top < 8) top = 8;
    }

    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.right = 'auto';
    menu.style.bottom = 'auto';
  }

  // ===== HEADER MENU =====
  function openHeaderMenu(e) {
    e.stopPropagation();
    closeCardMenu();
    const menu = document.getElementById('headerDropdown');
    const rect = e.currentTarget.getBoundingClientRect();
    positionDropdown(menu, rect);
  }
  function closeHeaderMenu() {
    document.getElementById('headerDropdown').style.display = 'none';
  }

  // ===== CARD MENU =====
  function openCardMenu(e, id) {
    e.stopPropagation();
    closeHeaderMenu();
    activeCardId = id;
    // Update fav label
    const acc = getAccounts().find(a => a.id == id);
    if (acc) {
      document.getElementById('ddFavLabel').textContent = acc.favorite ? t('remove_from_fav') : t('add_to_fav');
      const ddFavSvg = document.querySelector('#ddFav svg');
      if (ddFavSvg) {
        ddFavSvg.setAttribute('fill', acc.favorite ? '#f59e0b' : 'none');
        ddFavSvg.setAttribute('stroke', acc.favorite ? '#f59e0b' : 'currentColor');
      }
    }
    const menu = document.getElementById('cardDropdown');
    const rect = e.currentTarget.getBoundingClientRect();
    positionDropdown(menu, rect);
  }
  function closeCardMenu() {
    document.getElementById('cardDropdown').style.display = 'none';
    activeCardId = null;
  }

  function ddAction(action, e) {
    if (e) e.stopPropagation();
    const id = activeCardId;
    closeCardMenu();
    if (!id) return;
    const acc = getAccounts().find(a => a.id == id);
    if (!acc) return;
    if (action === 'copy') copyText(acc.rip);
    else if (action === 'share') shareText(acc.rip, acc.name);
    else if (action === 'edit') openEdit(acc.id, acc.name);
    else if (action === 'delete') openDelete(acc.id);
    else if (action === 'fav') {
      const newFav = !acc.favorite;
      updateAccount(acc.id, { favorite: newFav });
      showToast(newFav ? t('add_to_fav') : t('remove_from_fav'));
      renderAccounts();
    }
    else if (action === 'qr') openQRModal(acc.rip);
    else if (action === 'select') {
      enterSelectionMode();
      toggleSelect(acc.id);
    }
  }

  // ===== SELECTION =====
  function enterSelectionMode() {
    selectionMode = true;
    document.getElementById('selectionBar').classList.add('visible');
    renderAccounts();
    updateSelectionBar();
  }

  function cancelSelection() {
    selectionMode = false;
    selectedIds.clear();
    document.getElementById('selectionBar').classList.remove('visible');
    renderAccounts();
  }

  function startSelectAll() {
    enterSelectionMode();
    const all = getAccounts();
    all.forEach(a => selectedIds.add(a.id));
    renderAccounts();
    updateSelectionBar();
  }

  function toggleSelect(id) {
    if (!selectionMode) enterSelectionMode();
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    // Update card UI
    const card = document.getElementById('card-'+id);
    const chk = document.getElementById('chk-'+id);
    if (card) card.classList.toggle('selected', selectedIds.has(id));
    if (chk) chk.classList.toggle('checked', selectedIds.has(id));
    updateSelectionBar();
    if (selectedIds.size === 0) cancelSelection();
  }

  function updateSelectionBar() {
    document.getElementById('selectionCount').innerHTML =
      selectedIds.size + ' <span data-i18n="selected_count">' + t('selected_count') + '</span>';
  }

  function deleteSelected() {
    if (selectedIds.size === 0) { showToast(t('no_selection')); return; }
    showConfirmModal(t('confirm_delete_selected'), t('confirm_delete_selected_msg'), () => {
      let accounts = getAccounts().filter(a => !selectedIds.has(a.id));
      saveAccounts(accounts);
      cancelSelection();
      showToast(t('deleted'));
      renderAccounts();
    });
  }

  // ===== IMPORT / EXPORT =====
  function exportAccounts() {
    const all = getAccounts();
    if (all.length === 0) { showToast(t('no_accounts')); return; }
    const json = JSON.stringify(all, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my-ccp-accounts.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast(t('export_success'));
  }

  function importAccounts() {
    document.getElementById('importFileInput').click();
  }

  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        const existing = getAccounts();
        const existingRips = new Set(existing.map(a => a.rip));
        let added = 0;
        data.forEach(acc => {
          if (acc.rip && !existingRips.has(acc.rip)) {
            existing.push(acc);
            added++;
          }
        });
        saveAccounts(existing);
        showToast(t('import_success') + ' (' + added + ')');
        renderAccounts();
      } catch { showToast(t('import_error')); }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  function clearAllAccounts() {
    showConfirmModal(t('confirm_clear_accounts'), t('confirm_clear_accounts_msg'), () => {
      saveAccounts([]);
      showToast(t('deleted'));
      renderAccounts();
    });
  }

  // ===== DELETE MODAL =====
  function openDelete(id) {
    pendingDeleteId = id;
    document.getElementById('deleteModal').classList.add('open');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('open');
    pendingDeleteId = null;
  }
  function confirmDelete() {
    if (pendingDeleteId) {
      deleteAccount(pendingDeleteId);
      closeDeleteModal();
      showToast(t('deleted'));
      renderAccounts();
    }
  }

  // ===== EDIT MODAL =====
  function openEdit(id, name) {
    pendingEditId = id;
    document.getElementById('editNameInput').value = name;
    document.getElementById('editModal').classList.add('open');
  }
  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
    pendingEditId = null;
  }
  function confirmEdit() {
    const name = document.getElementById('editNameInput').value.trim();
    if (!name) return;
    updateAccount(pendingEditId, { name });
    closeEditModal();
    showToast(t('updated'));
    renderAccounts();
  }

  // Close menus on outside click
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#headerDropdown') && !e.target.closest('#menuDotsBtn'))
      closeHeaderMenu();
    if (!e.target.closest('#cardDropdown') && !e.target.closest('.dots-btn'))
      closeCardMenu();
  });

  document.getElementById('deleteModal').addEventListener('click', function(e){ if(e.target===this) closeDeleteModal(); });
  document.getElementById('editModal').addEventListener('click', function(e){ if(e.target===this) closeEditModal(); });

  renderAccounts();
</script>
</body>
</html>
