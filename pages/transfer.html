<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="transfer_page_title">مدير الحوالات - MY CCP</title>
  <meta name="theme-color" content="#1e3a8a"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    /* ===== TRANSFER PAGE ===== */
    .page-tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 10px rgba(37,99,235,0.25);
    }

    .op-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .op-row::-webkit-scrollbar { display: none; }
    .tr-op-btn {
      flex: 1;
      min-width: 85px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .tr-op-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37,99,235,0.28);
    }

    /* حقل الحساب السريع */
    .account-quick-wrap {
      margin-bottom: 6px;
    }
    .account-select-quick {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .account-fields-row {
      display: flex;
      gap: 8px;
    }
    .account-fields-row .input-group {
      flex: 2;
      margin-bottom: 0;
    }
    .account-fields-row .input-group.key-field {
      flex: 1;
    }

    /* السجل */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .history-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-count {
      font-size: 0.8rem;
      color: var(--text2);
      font-weight: 600;
    }
    .clear-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid #ef4444;
      background: transparent;
      color: #ef4444;
      font-family: 'Cairo', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* بطاقة الحوالة */
    .transfer-card {
      background: var(--surface2);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }
    .tc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
    }
    .tc-op-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1.5px solid;
    }
    .tc-amount {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text1);
      direction: ltr;
    }
    .tc-details {
      padding: 0 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tc-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text1);
      gap: 8px;
    }
    .tc-row span:first-child { color: var(--text2); font-weight: 600; white-space: nowrap; }
    .tc-row span:last-child  { text-align: start; overflow: hidden; text-overflow: ellipsis; }
    .tc-row.muted { opacity: 0.65; font-size: 0.75rem; }
    .tc-actions {
      display: flex;
      gap: 0;
      border-top: 1px solid var(--border);
    }
    .tc-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 0;
      transition: background 0.15s;
    }
    .tc-btn:first-child { border-inline-end: 1px solid var(--border); }
    .tc-btn:active { background: var(--surface3, var(--surface)); }
    .tc-btn.danger { color: #ef4444; }

    /* معاينة الحوالة */
    .preview-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .preview-row:last-child { border-bottom: none; }
    .preview-label {
      font-size: 0.8rem;
      color: var(--text2);
      font-weight: 600;
      white-space: nowrap;
    }
    .preview-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text1);
      text-align: start;
    }
    .preview-val.amount-val {
      color: var(--primary);
      font-size: 1rem;
    }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .empty-state p { font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--text1); }
    .empty-state span { font-size: 0.8rem; }

    /* form section scroll */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 8px;
    }

    /* input group inner label */
    .field-sub-label {
      font-size: 0.72rem;
      color: var(--text2);
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-title" data-i18n="transfer_page_title">مدير الحوالات</div>
    <div class="header-icons">
      <button class="header-btn" onclick="navigateTo('../index.html')" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="header-btn" id="menuBtn" onclick="openSidebar()" aria-label="menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div class="animate-in" style="display:flex;flex-direction:column;gap:10px;height:100%;">

      <!-- التبويبات -->
      <div class="page-tabs">
        <button class="tab-btn active" data-tab="form" onclick="switchTab('form')">
          ✏️ <span data-i18n="new_transfer_tab">حوالة جديدة</span>
        </button>
        <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
          📋 <span data-i18n="history_tab">السجل</span>
        </button>
      </div>

      <!-- ===== النموذج ===== -->
      <div id="formSection" class="form-section">

        <!-- نوع العملية -->
        <div class="input-group" style="padding-bottom:4px;">
          <span class="input-label" data-i18n="op_type">نوع العملية</span>
          <div class="op-row">
            <button class="tr-op-btn active" data-op="withdrawal" onclick="selectTransferOp('withdrawal')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <span data-i18n="op_withdrawal">سحب</span>
            </button>
            <button class="tr-op-btn" data-op="transfer" onclick="selectTransferOp('transfer')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              <span data-i18n="op_transfer">تحويل</span>
            </button>
            <button class="tr-op-btn" data-op="deposit" onclick="selectTransferOp('deposit')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
              <span data-i18n="op_deposit">دفع</span>
            </button>
          </div>
        </div>

        <!-- المبلغ -->
        <div class="input-group">
          <span class="input-label" data-i18n="amount_dzd">المبلغ (دج)</span>
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </span>
          <input type="tel" id="trAmount" data-i18n-ph="enter_amount_ph" placeholder="المبلغ بالدينار الجزائري" inputmode="decimal" autocomplete="off"/>
        </div>

        <!-- حساب المصدر (من) -->
        <div id="srcSection" style="display:flex;flex-direction:column;gap:6px;">
          <span class="input-label" id="srcLabel" data-i18n="src_account_label">حساب السحب</span>
          <div class="account-quick-wrap">
            <select class="account-select-quick" onchange="onSelectSrcAccount(this)">
              <option value="" data-i18n="select_from_saved">-- اختر من المحفوظات --</option>
            </select>
          </div>
          <div class="account-fields-row">
            <div class="input-group" style="margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="account_number_label">رقم الحساب</span>
              <input type="tel" id="srcAccount" placeholder="0000000000" inputmode="numeric" maxlength="10" autocomplete="off"/>
            </div>
            <div class="input-group key-field" style="margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="key_label">المفتاح</span>
              <input type="tel" id="srcKey" placeholder="00" inputmode="numeric" maxlength="2" autocomplete="off"/>
            </div>
          </div>
        </div>

        <!-- حساب الوجهة (إلى) -->
        <div id="dstSection" style="display:none;flex-direction:column;gap:6px;">
          <span class="input-label" id="dstLabel" data-i18n="dst_account_label">حساب الوجهة</span>
          <div class="account-quick-wrap">
            <select class="account-select-quick" onchange="onSelectDstAccount(this)">
              <option value="" data-i18n="select_from_saved">-- اختر من المحفوظات --</option>
            </select>
          </div>
          <div class="account-fields-row">
            <div class="input-group" style="margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="account_number_label">رقم الحساب</span>
              <input type="tel" id="dstAccount" placeholder="0000000000" inputmode="numeric" maxlength="10" autocomplete="off"/>
            </div>
            <div class="input-group key-field" style="margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="key_label">المفتاح</span>
              <input type="tel" id="dstKey" placeholder="00" inputmode="numeric" maxlength="2" autocomplete="off"/>
            </div>
          </div>
        </div>

        <!-- المستفيد -->
        <div id="benefSection" style="display:flex;flex-direction:column;gap:6px;">
          <span class="input-label" data-i18n="beneficiary_label">المستفيد</span>
          <div style="display:flex;gap:8px;">
            <div class="input-group" style="flex:1;margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="last_name_label">اللقب</span>
              <input type="text" id="benefLastName" data-i18n-ph="last_name_label" placeholder="اللقب" autocomplete="off"/>
            </div>
            <div class="input-group" style="flex:1;margin-bottom:0;">
              <span class="input-label" style="font-size:0.72rem;" data-i18n="first_name_label">الاسم</span>
              <input type="text" id="benefFirstName" data-i18n-ph="first_name_label" placeholder="الاسم" autocomplete="off"/>
            </div>
          </div>
          <div class="input-group" style="margin-bottom:0;">
            <span class="input-label" style="font-size:0.72rem;" data-i18n="address_label">العنوان</span>
            <input type="text" id="benefAddress" data-i18n-ph="address_label" placeholder="عنوان المستفيد" autocomplete="off"/>
          </div>
        </div>

        <!-- الموضوع -->
        <div class="input-group">
          <span class="input-label" data-i18n="subject_label">الموضوع</span>
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
          </span>
          <input type="text" id="trSubject" placeholder="موضوع العملية (اختياري)" autocomplete="off"/>
        </div>

        <!-- التاريخ -->
        <div class="input-group">
          <span class="input-label" data-i18n="date_label">التاريخ</span>
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <input type="date" id="trDate" autocomplete="off"/>
        </div>

        <!-- أزرار الإجراء -->
        <div style="display:flex;gap:10px;margin-top:4px;">
          <button class="btn btn-outline" onclick="resetForm()" style="flex:0 0 56px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
          </button>
          <button class="btn btn-primary" onclick="previewTransfer()" style="flex:1;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="preview_save_btn">معاينة وحفظ</span>
          </button>
        </div>

      </div>
      <!-- نهاية النموذج -->

      <!-- ===== السجل ===== -->
      <div id="historySection" class="history-section" style="display:none;">
        <div class="history-topbar">
          <span class="history-count" id="historyCount"></span>
          <button class="clear-btn" onclick="confirmClearAll()" data-i18n="clear_all_btn">مسح الكل</button>
        </div>
        <div id="historyList" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>

    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="navigateTo('../index.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="home">الرئيسية</span>
    </button>
    <button class="nav-item fees-active" style="color:var(--primary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span data-i18n="tool_transfer">الحوالات</span>
    </button>
    <button class="nav-item" onclick="navigateTo('../pages/settings.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </nav>
</div>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="../icons/icon-192.png" alt="MY CCP" class="sidebar-logo"/>
    <div class="sidebar-app-name">MY CCP</div>
    <div class="sidebar-version" data-i18n="free_version">النسخة المجانية</div>
  </div>
  <div class="sidebar-menu">
    <div class="sidebar-section-title" data-i18n="tools">الأدوات</div>
    <button class="sidebar-item" onclick="navigateTo('../index.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span data-i18n="tool_ccp_rip">CCP To RIP</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('fees.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span data-i18n="tool_fees">حاسبة الرسوم</span>
    </button>
    <button class="sidebar-item active" onclick="navigateTo('transfer.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span data-i18n="tool_transfer">مدير الحوالات</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('cheque.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span data-i18n="tool_cheque">ملء الصك البريدي</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('history.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      <span data-i18n="sidebar_history">السجل</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('settings.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="sidebar_settings">إعدادات التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('about.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="privacy">سياسة الخصوصية</span>
    </button>
  </div>
</aside>

<!-- MODAL: معاينة الحوالة -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="transfer_preview_title">معاينة الحوالة</div>
    <div id="previewContent" style="margin-bottom:16px;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closePreviewModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-success" onclick="saveTransferFromPreview()" style="flex:1;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span data-i18n="save_btn">حفظ</span>
      </button>
    </div>
  </div>
</div>

<!-- MODAL: تأكيد الحذف -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="delete_transfer_title">حذف الحوالة</div>
    <p style="text-align:center;color:var(--text2);font-size:0.9rem;margin:0 0 16px;" data-i18n="delete_transfer_msg">هل أنت متأكد من حذف هذه الحوالة؟</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cancelDelete()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn" onclick="doDeleteTransfer()" style="flex:1;background:#ef4444;color:#fff;" data-i18n="delete">حذف</button>
    </div>
  </div>
</div>

<!-- MODAL: تأكيد مسح الكل -->
<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="clear_all_transfers_title">مسح جميع الحوالات</div>
    <p style="text-align:center;color:var(--text2);font-size:0.9rem;margin:0 0 16px;" data-i18n="clear_all_transfers_msg">هل تريد حذف جميع الحوالات المحفوظة؟</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cancelClear()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn" onclick="doClearAll()" style="flex:1;background:#ef4444;color:#fff;" data-i18n="clear_all_btn">مسح الكل</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/transfer.js"></script>
</body>
</html>
